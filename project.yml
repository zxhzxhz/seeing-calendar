name: SeeingCalendar

options:
  bundleIdPrefix: com.seeingcalendar
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.13"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  SeeingCalendar:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SeeingCalendar
    settings:
      base:
        PRODUCT_NAME: SeeingCalendar
        PRODUCT_BUNDLE_IDENTIFIER: com.seeingcalendar.app
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
    info:
      path: SupportFiles/Info.plist
      properties:
        CFBundleDisplayName: 看见Calendar
        CFBundleName: SeeingCalendar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 拍摄照片并直接贴入当日画布，作为手绘日历的视觉素材。
        NSPhotoLibraryUsageDescription: 从相册导入照片或插画，贴入当日画布进行排版与绘制。
        NSPhotoLibraryAddUsageDescription: 将当日手绘作品导出到相册。
        NSLocalNetworkUsageDescription: 订阅局域网内的 ICS 日历源。
        CFBundleDocumentTypes:
          - CFBundleTypeName: 看见Calendar 归档
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.seeingcalendar.vcal
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.seeingcalendar.vcal
            UTTypeDescription: 看见Calendar 归档
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - vcal
              public.mime-type: application/x-vcal
