name: iOS Build (unsigned)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_NAME: SeeingCalendar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Probe @Observable semantics
        run: swift scripts/verify_observation_semantics.swift

      - name: Probe PencilKit stroke semantics
        run: swift scripts/verify_pencilkit_stroke_semantics.swift

      - name: Swift lint (机械体检 + 已知陷阱门禁)
        run: python3 scripts/swift_lint.py

      - name: Gate preflight (门禁自身的笔误：变量越界 / 目标文件写错)
        run: python3 scripts/gate_preflight.py   # 一行笔误即让整条流水线作废，先在这里拦住

      - name: Verify canvas transform math (real CoreGraphics)
        run: swift scripts/verify_transform_math.swift --strict   # 不变量不成立即让构建失败

      - name: Verify holiday tables (real bundled ICS + timezone invariants)
        run: swift scripts/verify_holiday_table.swift --strict   # 班休样式错一天即让构建失败

      - name: Verify thumbnail lifecycle (并发合并 + 非破坏提交 + 代次纪律)
        run: swift scripts/verify_thumbnail_lifecycle.swift --strict   # 翻回来缩略图丢失即让构建失败

      - name: Verify UI regressions (月份选择器 + 锁角标 + 横屏键盘压缩)
        run: swift scripts/verify_ui_regressions.swift --strict   # 网格错行 / 角标回潮 / 键盘压扁主屏即让构建失败

      - name: Verify subscription & workspace management (内置置底 + 不可删除 + 可改名)
        run: swift scripts/verify_subscription_management.swift --strict   # 列表顺序与删除目标错位即让构建失败

      - name: Verify undo history (复活不可能 + 检查器有牙 + PencilKit 单一引擎)
        run: swift scripts/verify_undo_history.swift --strict   # 被撤销的笔画又回来 / 检查器退化成恒真即让构建失败

      - name: Verify weather phase machine (迟到响应不得熄火 + 渲染路径无副作用)
        run: swift scripts/verify_weather_state.swift --strict   # 加载态提前熄火 / getter 触发网络即让构建失败

      - name: Verify refresh phase machine (并发合并 + 冷却窗口是状态 + 代次纪律)
        run: swift scripts/verify_refresh_state.swift --strict   # 先返回者提前熄火 / 迟到结果覆盖新结果即让构建失败

      - name: Verify pager phase machine (落位期屏蔽手势 + 阻尼/方向逐位等价)
        run: swift scripts/verify_pager_phase.swift --strict   # 落位动画被新手势打断即让构建失败

      - name: Verify canvas gesture phases (下拉返回握手 + 菜单退场冷却)
        run: swift scripts/verify_canvas_gesture.swift --strict   # 返回手势误触发 / 菜单退场吞掉正常点击即让构建失败

      - name: Verify editor session phases (自动保存身份校验 + 二次编辑前值收敛)
        run: swift scripts/verify_editor_session.swift --strict   # 换页后重复写盘 / 编辑态镜像漂移即让构建失败

      - name: Verify selection phase + interaction phase (单一写者 + 手势暂存收紧)
        run: swift scripts/verify_selection_state.swift --strict   # 选区真值出现第二个写者 / 错模式下取到垃圾几何即让构建失败

      - name: Verify drag phase (基点式位移 + 死区重锚不跳变)
        run: swift scripts/verify_drag_phase.swift --strict   # 增量累加漂移 / 死区一次性跳变即让构建失败

      - name: Verify editor sheet routing (模态互斥 + 13 个布尔收敛)
        run: swift scripts/verify_editor_sheet_routing.swift --strict   # 两个模态同真被静默丢弃即让构建失败

      - name: Verify input mode machine (7 态互斥 + 触控路由 + 边缘双击记忆)
        run: swift scripts/verify_input_mode.swift --strict   # 工具与套索成为可同时为真的野组合即让构建失败

      - name: Verify backup phase machine (终态互斥 + 等待策略态唯一持有者)
        run: swift scripts/verify_backup_phase.swift --strict   # 失败与成功摘要并存 / 弹窗状态漂移即让构建失败

      - name: Verify page order + subscription scope invariants (封面判定 + 空数组哨兵类型化)
        run: swift scripts/verify_page_and_scope_invariants.swift --strict   # 封面取到数组第一个（历史事故 #259）即让构建失败

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          # BUILD 号 = Actions run number，保证每个产物都能追溯到具体构建
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      - name: Report version
        if: success()
        run: |
          plutil -p "build/Build/Products/Release-iphoneos/${APP_NAME}.app/Info.plist" \
            | grep -E "CFBundleShortVersionString|CFBundleVersion" || true

      - name: Show compiler diagnostics
        if: failure()
        run: |
          echo "=== errors ==="
          grep -nE "error:" build.log | sort -u | head -150 || true
          echo "=== warnings ==="
          grep -nE "warning:" build.log | sort -u | head -80 || true

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          test -d "$APP"
          rm -rf Payload "${APP_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-unsigned.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SeeingCalendar-unsigned-ipa
          path: SeeingCalendar-unsigned.ipa
          if-no-files-found: error

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SeeingCalendar-dSYMs
          path: build/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SeeingCalendar-build-log
          path: build.log
          if-no-files-found: warn
